# ===============================
# TEST PROFILE (Isolated In-Memory DB)
# ===============================
spring.datasource.url=jdbc:h2:mem:hola_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

security.jwt.secret=hola-backend-test-secret-key-must-be-at-least-32-bytes-long-12345
security.jwt.access-token-expiration-seconds=3600
security.jwt.refresh-token-expiration-seconds=604800
security.cors.allowed-origins=http://localhost:3000
security.otp.expiration-minutes=10
security.otp.max-attempts=5
app.mail.enabled=false
app.mail.from=no-reply@hola.edu.vn


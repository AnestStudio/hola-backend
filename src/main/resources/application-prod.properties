# ===============================
# PROD PROFILE
# Activate with: -Dspring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)
# ===============================

# ===============================
# DATABASE (Require explicit env vars in production)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# SECURITY / JWT & CORS (Require explicit env vars in production)
# ===============================
security.jwt.secret=${JWT_SECRET}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# MAIL (SMTP) (Require explicit env vars in production)
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# LOGGING
# ===============================
logging.level.root=WARN
logging.level.org.anest.hola=INFO

# ===============================
# SWAGGER / OPENAPI UI (Disabled in prod)
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


spring.application.name=hola-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties]

# ===============================
# PROFILE & I18N MESSAGES
# ===============================
#spring.profiles.default=dev
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hola?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# PAGINATION (Spring Data Web)
# ===============================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# SECURITY / JWT & CORS
# ===============================
security.jwt.secret=${JWT_SECRET:hola-backend-local-dev-secret-key-must-be-at-least-32-bytes-long}
security.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:3600}
security.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
security.jwt.cleanup-cron=${JWT_CLEANUP_CRON:0 0 3 * * *}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ===============================
# MAIL (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@hola.edu.vn}}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
